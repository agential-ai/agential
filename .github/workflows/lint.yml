name: Lint

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "agential/**"
      - ".github/workflows/lint.yml"
  push:
    branches:
      - main
    paths:
      - "agential/**"
      - ".github/workflows/lint.yml"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff Lint
        run: ruff check agential
