[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agential"
version = "0.2.1"
description = "A flexible agent library."
authors = [
    {name = "Vincent Tu", email = "tuvincent0106@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["agent", "LLM", "uv"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "langchain-community>=0.3.26",
    "langchain-huggingface>=0.1.0",
    "rich>=13.0.0",
    "litellm>=1.0.0",
    "func-timeout>=4.3.5",
    "wikipedia>=1.4.0",
    "thefuzz>=0.19.0",
    "scipy>=1.11.0",
    "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "python-dotenv>=1.0.0",
    "ruff>=0.0.289",
    "ipython>=8.15.0",
    "pytest>=7.4.2",
    "pytest-cov>=4.1.0",
    "ipykernel>=6.29.5",
]

[project.urls]
Repository = "https://github.com/alckasoc/agential"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
